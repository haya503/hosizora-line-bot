name: 星空予報 LINE通知

# 定期通知は次の 2 つから起動する（どちらも「自動実行」として同じ扱い）。
#   1. Cloud Scheduler から workflow_dispatch（inputs.scheduled=true）で時刻どおりに起動する（メイン）
#   2. GitHub Actions の schedule（予備）。数時間遅れたり間引かれたりする
# 自動実行は NOTIFY_START_HOUR_JST 時以降に最初に起動したジョブだけが通知し、
# 通知済みかどうかは日付ごとのキャッシュで判定する。
on:
  schedule:
    - cron: '7 1-10 * * *'  # 10:07〜19:07 JST に 1 時間おき (UTC+9)
  workflow_dispatch:  # 手動実行（scheduled=false）は時刻・通知済みに関係なく必ず送信する
    inputs:
      scheduled:
        description: 'Cloud Scheduler からの自動実行として扱う（時刻・通知済みを判定する）'
        type: boolean
        default: false
      dry_run:
        description: 'LINE / Discord に送らず、送る内容と気象 API の診断結果をログに出す'
        type: boolean
        default: false

# 同時に起動したジョブが二重に通知しないよう直列化する
concurrency:
  group: notify
  cancel-in-progress: false

env:
  # この時刻 (JST) より前に起動したジョブは通知しない。
  # 実績では 10 回の予約のうち実際に起動するのは 1 日 2 回ほどで、16 時台と 0 時前後に集中している。
  # 17 時にすると 16 時台の起動がスキップされ深夜に届くため、16 時にしている
  NOTIFY_START_HOUR_JST: 16
  # Cloud Scheduler からの起動で、この時刻 (JST) より前のものは、気象データの取得に失敗しても
  # 失敗を通知せずジョブを失敗させ、次の起動（Cloud Scheduler の 18:00・19:00）で再試行する。
  # GitHub の定期実行は次にいつ起動するか当てにならない（翌日まで起動しないこともある）ため、
  # 再試行は待たずにその場で失敗を通知する
  NOTIFY_RETRY_UNTIL_HOUR_JST: 19

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.time.outputs.today }}
      auto: ${{ steps.time.outputs.auto }}
      retry_later: ${{ steps.time.outputs.retry_later }}
      should_notify: ${{ steps.decide.outputs.should_notify }}
    steps:
      - name: 現在時刻 (JST) を確認
        id: time
        env:
          SCHEDULED_INPUT: ${{ inputs.scheduled }}
        run: |
          auto=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$SCHEDULED_INPUT" = "true" ]; then
            auto=true
          fi
          echo "auto=${auto}" >> "$GITHUB_OUTPUT"
          today=$(TZ=Asia/Tokyo date +%F)
          hour=$(TZ=Asia/Tokyo date +%-H)
          echo "現在 ${today} ${hour}時 (JST)"
          echo "today=${today}" >> "$GITHUB_OUTPUT"
          if [ "$hour" -ge "$NOTIFY_START_HOUR_JST" ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SCHEDULED_INPUT" = "true" ] && [ "$hour" -lt "$NOTIFY_RETRY_UNTIL_HOUR_JST" ]; then
            echo "retry_later=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 本日の通知済みマーカーを確認
        id: marker
        if: steps.time.outputs.auto == 'true' && steps.time.outputs.in_window == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .notified
          key: notified-${{ steps.time.outputs.today }}
          lookup-only: true

      - name: 通知するか判定
        id: decide
        env:
          AUTO: ${{ steps.time.outputs.auto }}
          IN_WINDOW: ${{ steps.time.outputs.in_window }}
          ALREADY_NOTIFIED: ${{ steps.marker.outputs.cache-hit }}
        run: |
          if [ "$AUTO" != "true" ]; then
            echo "手動実行のため送信します"
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "$IN_WINDOW" != "true" ]; then
            echo "${NOTIFY_START_HOUR_JST}:00 JST より前のためスキップします"
          elif [ "$ALREADY_NOTIFIED" = "true" ]; then
            echo "本日は通知済みのためスキップします"
          else
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: check
    if: needs.check.outputs.should_notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: skyfield データキャッシュ
        uses: actions/cache@v4
        with:
          path: /tmp/skyfield-data
          key: skyfield-de421-${{ hashFiles('requirements.txt') }}

      - name: パッケージをインストール
        run: pip install -r requirements.txt

      - name: 気象 API の診断 (dry run のみ)
        if: inputs.dry_run
        run: python src/sky_forecast.py

      - name: 星空予報を送信
        run: python src/notify.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_NOTIFY_TARGETS: ${{ secrets.LINE_NOTIFY_TARGETS }}
          LOCATION_LAT: ${{ secrets.LOCATION_LAT }}
          LOCATION_LON: ${{ secrets.LOCATION_LON }}
          HOSHIMIRU_API_TOKEN: ${{ secrets.HOSHIMIRU_API_TOKEN }}
          JMA_AREA_CODE: ${{ secrets.JMA_AREA_CODE }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SKYFIELD_DATA_PATH: /tmp/skyfield-data
          NOTIFY_RETRY_LATER: ${{ needs.check.outputs.retry_later }}
          NOTIFY_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: 通知済みマーカーを作成
        if: needs.check.outputs.auto == 'true' && !inputs.dry_run
        run: echo "${{ needs.check.outputs.today }}" > .notified

      - name: 通知済みマーカーを保存
        if: needs.check.outputs.auto == 'true' && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .notified
          key: notified-${{ needs.check.outputs.today }}
