name: API ヘルスチェック（一時）

on:
  push:
    branches:
      - claude/api-healthcheck

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: skyfield データキャッシュ
        uses: actions/cache@v4
        with:
          path: /tmp/skyfield-data
          key: skyfield-de421-${{ hashFiles('requirements.txt') }}

      - name: パッケージをインストール
        run: pip install -r requirements.txt

      - name: 各 API を叩いて結果を表示（LINE 送信なし）
        run: python api_healthcheck.py
        env:
          PYTHONPATH: src
          HOSHIMIRU_API_TOKEN: ${{ secrets.HOSHIMIRU_API_TOKEN }}
          JMA_AREA_CODE: ${{ secrets.JMA_AREA_CODE }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SKYFIELD_DATA_PATH: /tmp/skyfield-data
